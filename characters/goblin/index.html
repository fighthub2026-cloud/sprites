<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Goblin — animações</title>
<style>
body{margin:0;background:#161d24;color:#eef2f6;font:16px system-ui;display:grid;justify-items:center;padding:24px;gap:16px}
h1,p{margin:0}canvas{width:min(76vh,90vw);height:auto;background-color:#e4e8ec;background-image:linear-gradient(45deg,#ccd3db 25%,transparent 25%),linear-gradient(-45deg,#ccd3db 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#ccd3db 75%),linear-gradient(-45deg,transparent 75%,#ccd3db 75%);background-size:32px 32px;background-position:0 0,0 16px,16px -16px,-16px 0;border-radius:16px}
select,button{padding:10px;border-radius:8px;font:inherit}label{display:inline-flex;align-items:center;gap:8px}.controls{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
</style>
<h1>Goblin</h1>
<p>Personagem montado por peças • 17 animações</p>
<canvas id="sprite" width="900" height="900"></canvas>
<div class="controls"><select id="animation" aria-label="Animação"></select><button id="pause">Pausar</button><label>Velocidade <input id="speed" type="range" min="0.25" max="2" step="0.25" value="1"></label></div>
<p id="status">Carregando peças…</p>
<script type="module">
import {SpriterPlayer} from './player.js';
const player = await new SpriterPlayer().load();
const canvas = document.querySelector('canvas'), select = document.querySelector('select');
for (const a of player.rig.animations.filter(a=>a.name!=='Base')) select.add(new Option(a.name,a.name));
select.value='Idle';
let time=0,last=performance.now(),paused=false;
select.onchange=()=>{time=0;};
document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Reproduzir':'Pausar';};
function frame(now){if(!paused)time+=(now-last)*Number(document.querySelector('#speed').value);last=now;player.draw(canvas,select.value,time);requestAnimationFrame(frame);}
window.renderFrame=(name,t)=>{paused=true;player.draw(canvas,name,t);return canvas.toDataURL('image/png');};
window.spriteReady=true;
document.querySelector('#status').textContent='Corpo e rig do Orc de referência; cabeça adaptada para Goblin.';
requestAnimationFrame(frame);
</script>
</html>
